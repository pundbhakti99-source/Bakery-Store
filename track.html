<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Track Your Treats | The Golden Whisk</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .track-container { max-width: 500px; margin: 100px auto; padding: 30px; background: white; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .status-bar { display: flex; justify-content: space-between; margin-top: 40px; position: relative; }
        .status-step { width: 20px; height: 20px; background: #ddd; border-radius: 50%; z-index: 2; }
        .status-step.active { background: #82937E; box-shadow: 0 0 10px rgba(130, 147, 126, 0.5); }
        .line { position: absolute; top: 9px; left: 0; width: 100%; height: 2px; background: #eee; z-index: 1; }
        .status-label { font-size: 0.75rem; margin-top: 10px; font-weight: 600; color: #999; }
    </style>
</head>
<body>
    <div class="track-container">
        <h2 style="font-family: 'Cormorant Garamond';">Track Your Order</h2>
        <p id="orderRef" style="font-size: 0.8rem; color: #666; margin-top: 10px;">Checking status...</p>
        
        <div class="status-bar">
            <div class="line"></div>
            <div><div class="status-step active"></div><div class="status-label" style="color:#82937E">Ordered</div></div>
            <div><div class="status-step active"></div><div class="status-label" style="color:#82937E">Baking</div></div>
            <div><div class="status-step"></div><div class="status-label">Out for Delivery</div></div>
            <div><div class="status-step"></div><div class="status-label">Enjoy!</div></div>
        </div>
        
        <button onclick="window.location.href='index.html'" class="buy-btn" style="margin-top: 40px; width: 100%;">Back to Shop</button>
    </div>

    <script>
        const lastOrder = JSON.parse(localStorage.getItem('last_processed_order'));
        if(lastOrder) {
            document.getElementById('orderRef').innerText = `Status for Order: ${lastOrder.orderID}`;
        } else {
            document.getElementById('orderRef').innerText = "No active orders found.";
        }
    </script>
</body>
</html>
