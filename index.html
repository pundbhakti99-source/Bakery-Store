<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Golden Whisk | Artisan Bakery</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="#" class="logo">G<span>W</span></a>
        <input type="text" id="searchInput" placeholder="Search our bakery...">
        <ul class="nav-links">
            <li><a href="#menu" onclick="jumpToCategory('all')">Menu</a></li>
            <li id="userLink" onclick="openAuthModal()"><a href="#">Sign In</a></li>
            <li onclick="toggleCart()"><a href="#">Cart (<span id="cartCount">0</span>)</a></li>
        </ul>
    </div>
</nav>

<header class="hero">
    <div class="hero-text">
        <h1>Soft Bakes, Early Mornings.</h1>
        <p>Select a category to explore our fresh bakes.</p>
        <div class="category-jump-container">
            <div class="cat-card" onclick="jumpToCategory('cookies')">
                <img src="https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400" alt="Cookies">
                <span>Cookies</span>
            </div>
            <div class="cat-card" onclick="jumpToCategory('pastries')">
                <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400" alt="Pastries">
                <span>Pastries</span>
            </div>
            <div class="cat-card" onclick="jumpToCategory('cakes')">
                <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400" alt="Cakes">
                <span>Cakes</span>
            </div>
        </div>
    </div>
</header>

<section class="products" id="menu" style="display: none;">
    <div class="filter-container">
        <button class="filter-btn" id="btn-all" onclick="filterCategory('all', event)">All</button>
        <button class="filter-btn" id="btn-cookies" onclick="filterCategory('cookies', event)">Cookies</button>
        <button class="filter-btn" id="btn-pastries" onclick="filterCategory('pastries', event)">Pastries</button>
        <button class="filter-btn" id="btn-cakes" onclick="filterCategory('cakes', event)">Cakes</button>
    </div>
    <div class="product-grid" id="productGrid"></div>
</section>

<div id="productPageModal" class="pp-modal">
    <div class="pp-content">
        <span class="pp-close" onclick="closeProductPage()">&times;</span>
        <div class="pp-grid">
            <div class="pp-image-side">
                <img id="pp-main-img" src="" alt="">
            </div>
            <div class="pp-info-side">
                <h1 id="pp-name">Product Name</h1>
                <div class="pp-price-tag">
                    <span id="pp-price">₹0</span>
                    <span class="tax-info">(Inclusive of GST)</span>
                </div>
                <p id="pp-desc" class="pp-description"></p>

                <div class="pp-option-group">
                    <label>Select Weight</label>
                    <div class="weight-selector">
                        <button class="w-btn active" data-mult="1">0.5 Kg</button>
                        <button class="w-btn" data-mult="1.8">1 Kg</button>
                        <button class="w-btn" data-mult="3.5">2 Kg</button>
                    </div>
                </div>

                <div class="pp-option-group">
                    <label>Cake Message (Optional)</label>
                    <input type="text" id="pp-msg" placeholder="Write A Sweet Wish!" maxlength="25">
                </div>

                <div class="pp-option-group">
                    <label>Pincode Check</label>
                    <div class="delivery-check">
                        <input type="text" placeholder="Enter Pincode">
                        <button type="button">Check</button>
                    </div>
                </div>

                <button class="buy-now-btn" onclick="addToCartFromPage()">Buy Now | <span id="pp-btn-price">₹0</span></button>
            </div>
        </div>
    </div>
</div>

<script src="product.js"></script>
<script src="script.js"></script>
</body>
</html>
