<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Golden Whisk</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; color: #333; display: flex; justify-content: center; padding: 20px; }
        .receipt-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 8px solid #82937E; }
        .header { text-align: center; margin-bottom: 20px; }
        .order-id { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .item-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; }
        .total-row { border-top: 1px dashed #ddd; margin-top: 15px; padding-top: 15px; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; }
        .details { margin-top: 20px; font-size: 0.85rem; color: #666; line-height: 1.6; }
        .back-btn { display: block; text-align: center; margin-top: 30px; padding: 12px; background: #82937E; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>

<div class="receipt-card">
    <div class="header">
        <h2 style="margin: 5px 0;">Thank You!</h2>
        <p class="order-id" id="receipt-id">Order #-------</p>
    </div>
<div id="receipt-items"></div>

<div style="border-top: 1px solid #eee; margin-top: 15px; padding-top: 10px; font-size: 0.9rem; color: #666;">
    <div class="item-row">
        <span>Subtotal</span>
        <span id="receipt-subtotal">₹0</span>
    </div>
    <div class="item-row" id="receipt-discount-row" style="display: none; color: #82937E;">
        <span>Promo Discount</span>
        <span id="receipt-discount-val">-₹0</span>
    </div>
</div>

<div class="total-row">
    <span>Grand Total</span>
    <span id="receipt-total">₹0</span>
</div>
    

    <div class="details">
        <strong>Delivering to:</strong><br>
        <span id="receipt-address">Loading address...</span><br><br>
        <strong>Payment:</strong> <span id="receipt-method">---</span>
    </div>

    <a href="index.html" class="back-btn">Back to Shop</a>
</div>

<script>
    window.onload = () => {
        // 1. Retrieve the order data saved right before the redirect
        const order = JSON.parse(localStorage.getItem('last_processed_order'));

        // 2. If no order data exists, send them back to the shop
        if (!order) {
            window.location.href = 'index.html'; 
            return;
        }

        // 3. Fill in the Receipt UI
        // Note: Ensure these IDs (receipt-id, etc.) match your HTML elements
        if(document.getElementById('receipt-id')) {
            document.getElementById('receipt-id').innerText = `Order #${order.Order_ID}`;
        }
        
    
        // ... inside window.onload on confirmation.html ...

        if(document.getElementById('receipt-total')) {
            document.getElementById('receipt-total').innerText = order.Grand_Total;
        }

        // Add this logic to handle the subtotal and discount display
        if(order.Subtotal) {
            document.getElementById('receipt-subtotal').innerText = order.Subtotal;
        }

        if(order.Discount && order.Discount !== "None") {
            const sub = parseInt(order.Subtotal.replace('₹', ''));
            const grand = parseInt(order.Grand_Total.replace('₹', ''));
            
            document.getElementById('receipt-discount-row').style.display = 'flex';
            document.getElementById('receipt-discount-val').innerText = `-₹${sub - grand}`;
        }
// ...
        
        if(document.getElementById('receipt-address')) {
            document.getElementById('receipt-address').innerText = order.Delivery_Address;
        }

        if(document.getElementById('receipt-method')) {
            document.getElementById('receipt-method').innerText = order.Payment_Method;
        }

        // 4. Render the Item List
        const itemContainer = document.getElementById('receipt-items');
        if (itemContainer && order.Items) {
            const itemsList = order.Items.split('\n');
            itemContainer.innerHTML = itemsList.map(item => `
                <div class="item-row">
                    <span>${item}</span>
                </div>
            `).join('');
        }

        // 5. THE CLEANUP
        // Now that the receipt is showing, clear the cart so it's empty for next time
        localStorage.removeItem("golden_whisk_cart");
        
        // Optional: Clear the receipt data from memory after a delay for privacy
        // setTimeout(() => localStorage.removeItem('last_processed_order'), 600000);
    };
</script>
    
    
</body>
</html>
