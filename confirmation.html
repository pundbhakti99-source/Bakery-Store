<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | Golden Whisk</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; color: #333; display: flex; justify-content: center; padding: 20px; }
        .receipt-card { background: white; width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 8px solid #82937E; }
        .header { text-align: center; margin-bottom: 20px; }
        .order-id { font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .item-row { display: flex; justify-content: space-between; margin: 10px 0; font-size: 0.95rem; }
        .total-row { border-top: 1px dashed #ddd; margin-top: 15px; padding-top: 15px; font-weight: bold; font-size: 1.2rem; display: flex; justify-content: space-between; }
        .details { margin-top: 20px; font-size: 0.85rem; color: #666; line-height: 1.6; }
        .back-btn { display: block; text-align: center; margin-top: 30px; padding: 12px; background: #82937E; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>

<div class="receipt-card">
    <div class="header">
        <h2 style="margin: 5px 0;">Thank You!</h2>
        <p class="order-id" id="receipt-id">Order #-------</p>
    </div>

    <div id="receipt-items">
        </div>

    <div class="total-row">
        <span>Grand Total</span>
        <span id="receipt-total">₹0</span>
    </div>

    <div class="details">
        <strong>Delivering to:</strong><br>
        <span id="receipt-address">Loading address...</span><br><br>
        <strong>Payment:</strong> <span id="receipt-method">---</span>
    </div>

    <a href="index.html" class="back-btn">Back to Shop</a>
</div>

<script>
    window.onload = () => {
        // 1. Retrieve the data we saved in the index.html proceedToCheckout function
        const savedData = localStorage.getItem('last_processed_order');

        if (!savedData) {
            // If someone tries to visit this page directly without ordering
            document.body.innerHTML = `
                <div style="text-align:center; padding:50px;">
                    <h2>No recent order found.</h2>
                    <p>Your session may have expired or the order wasn't completed.</p>
                    <a href="index.html" style="color:#82937E; font-weight:bold;">Go back to Bakery</a>
                </div>`;
            return;
        }

        const order = JSON.parse(savedData);

        // 2. Map the saved data to your HTML IDs
        document.getElementById('receipt-id').innerText = `Order #${order.Order_ID || 'GW-0000'}`;
        document.getElementById('receipt-total').innerText = order.Grand_Total;
        document.getElementById('receipt-address').innerText = order.Delivery_Address;
        
        // Use a fallback if Payment_Method wasn't captured
        document.getElementById('receipt-method').innerText = order.Payment_Method || 'Online Payment';

        // 3. Render Items 
        // We split by newline because that's how we joined them in the checkout function
        const itemContainer = document.getElementById('receipt-items');
        const itemsList = order.Items.split('\n');
        
        itemContainer.innerHTML = itemsList.map(item => {
            // If the string contains a " - ", let's split it for a better "Item vs Price" look
            const parts = item.split(' - ');
            if (parts.length > 1) {
                return `
                    <div class="item-row">
                        <span>${parts[0]}</span>
                        <span style="color:#82937E;">${parts[1]}</span>
                    </div>`;
            }
            return `<div class="item-row"><span>${item}</span></div>`;
        }).join('');

        // 4. THE CLEANUP (Very Important)
        // Now that the receipt is shown, clear the active cart so it's empty for the next visit
        localStorage.removeItem("golden_whisk_cart");
        
        // Optional: If you want to clear the receipt data after 5 minutes for privacy:
        // setTimeout(() => localStorage.removeItem('last_processed_order'), 300000);
    };
</script>
    
</body>
</html>
